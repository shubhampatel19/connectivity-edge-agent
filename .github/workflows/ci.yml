name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          [ -z "$(git status --porcelain -- go.mod go.sum)" ] || { git diff -- go.mod go.sum; echo "::error::go.mod or go.sum is not tidy: run go mod tidy and commit the result"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t edge-agent:ci .
